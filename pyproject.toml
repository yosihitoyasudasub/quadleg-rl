[project]
name = "quadleg-rl"
version = "0.1.0"
description = "Quadruped leg design + RL locomotion (MuJoCo Playground)"
requires-python = ">=3.10"
dependencies = [
    "playground",
    "jax<0.11",            # brax 0.14 は JAX 0.11 で削除された jax.device_put_replicated を使う
    "flax>=0.12",          # 古い flax は JAX 0.10 で移動した jax.core.get_opaque_trace_state を呼ぶ
    "mediapy",
    "matplotlib",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]==0.10.*"]   # brax 0.14 は JAX 0.11 で削除された device_put_replicated を使う

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quadleg_rl*"]
