[project]
name = "quadleg-rl"
version = "0.1.0"
description = "Quadruped leg design + RL locomotion (MuJoCo Playground)"
requires-python = ">=3.10"
dependencies = [
    "playground",
    "flax>=0.12",          # 古い flax は JAX 0.11 で削除された jax.core.get_opaque_trace_state を呼ぶ
    "mediapy",
    "matplotlib",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quadleg_rl*"]
