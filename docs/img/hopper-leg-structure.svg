<text x="325" y="238" font-size="11" fill="#8a4b10" text-anchor="middle">2</text>
<circle cx="325.0" cy="200.0" r="16.2" fill="none" stroke="#c9762b" stroke-width="1.2"/>
<line x1="275.0" y1="200.0" x2="184.5" y2="266.9" stroke="#4a6fa5" stroke-width="9" stroke-linecap="round"/>
