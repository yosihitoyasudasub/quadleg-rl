<rect width="1060" height="710" fill="#ffffff"/>
<text x="22" y="30" font-size="18" font-weight="bold">一本脚ホッパー 脚の構造（5 節リンク ＋ 直列バネ ＋ ロール軸）</text>
<text x="22" y="50" font-size="12" fill="#5b6470">姿勢は飛行・引込み（リンク先端長 145 mm）。寸法は MuJoCo モデルと docs/hopper-mechanical-spec.md に一致</text>
<text x="40" y="72" font-size="14" font-weight="bold">A. 側面図（脚面 = XY。+X 前方・+Y 上。脚長サーボの軸は紙面に垂直）</text>
<rect x="112" y="85" width="375" height="70" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="120" y="118" font-size="11.5" fill="#4a6fa5">胴体（重心を股軸の高さに置く。実際は股まわりを囲む）</text>
