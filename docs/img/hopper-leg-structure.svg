<line x1="348" y1="514" x2="339" y2="522" stroke="#c8c8c8"/>
<line x1="362" y1="514" x2="354" y2="522" stroke="#c8c8c8"/>
<circle cx="275.0" cy="200.0" r="4.5" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="243" y="194" font-size="11.5" font-weight="600">P1</text>
<circle cx="325.0" cy="200.0" r="4.5" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="338" y="194" font-size="11.5" font-weight="600">P2</text>
<circle cx="184.5" cy="266.9" r="4.5" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="153" y="272" font-size="11.5" font-weight="600">K1</text>
<circle cx="415.5" cy="266.9" r="4.5" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="428" y="272" font-size="11.5" font-weight="600">K2</text>
<circle cx="300.0" cy="381.2" r="4.5" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="315" y="386" font-size="11.5" font-weight="600">F</text>
<line x1="275" y1="170" x2="325" y2="170" stroke="#5b6470" stroke-width="1" marker-start="url(#dim2)" marker-end="url(#dim)"/>
<text x="300" y="165" font-size="11" fill="#5b6470" text-anchor="middle">d0 = 40</text>
<line x1="263" y1="184" x2="173" y2="251" stroke="#5b6470" stroke-width="1" marker-start="url(#dim2)" marker-end="url(#dim)"/>
<text x="218" y="212" font-size="11" fill="#5b6470" text-anchor="middle">l1 = 90</text>
<line x1="166" y1="286" x2="281" y2="400" stroke="#5b6470" stroke-width="1" marker-start="url(#dim2)" marker-end="url(#dim)"/>
<text x="223" y="338" font-size="11" fill="#5b6470" text-anchor="middle">l2 = 130</text>
<line x1="452" y1="200" x2="452" y2="381" stroke="#5b6470" stroke-width="1" marker-start="url(#dim2)" marker-end="url(#dim)"/>
<text x="458" y="290" font-size="11" fill="#5b6470">先端長 145</text>
<line x1="452" y1="381" x2="452" y2="506" stroke="#5b6470" stroke-width="1" marker-start="url(#dim2)" marker-end="url(#dim)"/>
<text x="458" y="444" font-size="11" fill="#5b6470">バネ 100</text>
<line x1="135" y1="200" x2="135" y2="506" stroke="#5b6470" stroke-width="1" marker-start="url(#dim2)" marker-end="url(#dim)"/>
<text x="68" y="332" font-size="11" fill="#5b6470">L0 = 260</text>
<text x="60" y="350" font-size="11" fill="#5b6470">（股→接地）</text>
<text x="222" y="265" font-size="11" fill="#4a6fa5">θ1 = −143.5°</text>
<text x="320" y="265" font-size="11" fill="#4a6fa5">θ2 = −36.5°</text>
<text x="324" y="366" font-size="11" fill="#2f9e8f">内角 90.5°</text>
<text x="338" y="502" font-size="11" fill="#333">ゴムパッド φ50</text>
<text x="40" y="528" font-size="11.5" fill="#5b6470">①② XM540-W270（脚長、10.6 N·m / 30 rpm）　③ XH540-W150（ロール、7.1 N·m / 70 rpm）</text>
<text x="40" y="547" font-size="11.5" fill="#5b6470">P1 / P2: サーボ出力軸（駆動）　K1 / K2: 膝（受動）　F: 足先（下腿 2 本が合流 ＝ 閉ループ）</text>
<text x="40" y="566" font-size="11.5" fill="#5b6470">下腿は膝と足先の 2 点だけで支持される「二力部材」で、軸力しか掛からない</text>
<text x="40" y="585" font-size="11.5" fill="#5b6470">（曲げの設計が要らない）。膝は受動関節なので、脚にサーボが載らない。</text>
<text x="40" y="604" font-size="11.5" fill="#5b6470">2 個のサーボが荷重を分担し、脚長と前後の振りを同時に作る。</text>
<text x="560" y="80" font-size="14" font-weight="bold">B. Z 方向の層構成（脚長サーボの軸に沿った断面。§4-6 向かい合わせ）</text>
<rect x="573" y="106" width="154" height="52" fill="#ffe9d2" stroke="#c9762b" stroke-width="1.6"/>
<line x1="650" y1="158" x2="650" y2="166" stroke="#aaa" stroke-width="0.8"/>
<rect x="727" y="106" width="9" height="52" fill="#f6d5b0" stroke="#c9762b" stroke-width="1.6"/>
<line x1="732" y1="158" x2="732" y2="181" stroke="#aaa" stroke-width="0.8"/>
<rect x="736" y="106" width="18" height="52" fill="#dbe6f3" stroke="#4a6fa5" stroke-width="1.6"/>
<line x1="745" y1="158" x2="745" y2="196" stroke="#aaa" stroke-width="0.8"/>
<rect x="754" y="106" width="9" height="52" fill="#f6d5b0" stroke="#c9762b" stroke-width="1.6"/>
<line x1="758" y1="158" x2="758" y2="211" stroke="#aaa" stroke-width="0.8"/>
<rect x="763" y="106" width="154" height="52" fill="#ffe9d2" stroke="#c9762b" stroke-width="1.6"/>
<line x1="840" y1="158" x2="840" y2="226" stroke="#aaa" stroke-width="0.8"/>
<text x="654" y="170" font-size="10.5" fill="#c9762b">サーボ② 本体 44</text>
<text x="736" y="185" font-size="10.5" fill="#c9762b">ホーン②</text>
<text x="749" y="200" font-size="10.5" fill="#4a6fa5">クランク①② 5</text>
<text x="762" y="215" font-size="10.5" fill="#c9762b">ホーン①</text>
<text x="844" y="230" font-size="10.5" fill="#c9762b">サーボ① 本体 44</text>
<line x1="563" y1="132" x2="927" y2="132" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="8 3 2 3"/>
<text x="932" y="136" font-size="11" fill="#c0392b">サーボ軸（Z）</text>
<line x1="745" y1="100" x2="745" y2="162" stroke="#4a6fa5" stroke-width="1" stroke-dasharray="4 3"/>
<text x="745" y="98" font-size="10.5" fill="#4a6fa5" text-anchor="middle">脚面 z = 0</text>
<text x="560" y="266" font-size="11.5" font-weight="600" fill="#c0392b">2 個のサーボは脚面を挟んで向かい合わせ（§4-6）</text>
<text x="560" y="286" font-size="11.5" fill="#5b6470">両クランクが同じ脚面 z = 0 に載る（可動域で XY が重ならないので同じ z でよい）。</text>
<text x="560" y="303" font-size="11.5" fill="#5b6470">脚が平面のままなので出力軸にスラストが出ず、ブラケットの面外モーメントも左右で相殺。</text>
<text x="560" y="320" font-size="11.5" fill="#5b6470">脚サーボ 2 個が z = ±27 に対称に載るので機体重心も脚面に来る。股の厚みは約 98 mm。</text>
<text x="560" y="337" font-size="11.5" fill="#5b6470">両持ちにするなら各クランクの反対面（クランク① は z −3〜−6、x −33〜−7）に軸受板。</text>
<text x="560" y="364" font-size="14" font-weight="bold">C. 膝 K・足先 F の関節（二面せん断 = クレビス）</text>
<rect x="600" y="412" width="140" height="26" fill="#dbe6f3" stroke="#4a6fa5" stroke-width="1.6"/>
<rect x="660" y="402" width="140" height="10" fill="#d6efe9" stroke="#2f9e8f" stroke-width="1.6"/>
<rect x="660" y="438" width="140" height="10" fill="#d6efe9" stroke="#2f9e8f" stroke-width="1.6"/>
<rect x="774" y="402" width="26" height="46" fill="#d6efe9" stroke="#2f9e8f" stroke-width="1.6"/>
<rect x="683" y="412" width="6" height="26" fill="#f3d9d9" stroke="#c0392b" stroke-width="1.2"/>
<rect x="703" y="412" width="6" height="26" fill="#f3d9d9" stroke="#c0392b" stroke-width="1.2"/>
<rect x="686" y="388" width="20" height="14" rx="2" fill="#9aa4b0" stroke="#444" stroke-width="1.4"/>
<rect x="689" y="402" width="14" height="46" fill="#b9c2cc" stroke="#444" stroke-width="1.4"/>
<rect x="691" y="448" width="10" height="13" fill="#7f8894" stroke="#444" stroke-width="1.2"/>
<line x1="630" y1="438" x2="630" y2="474" stroke="#4a6fa5" stroke-width="0.9"/>
<text x="560" y="486" font-size="11.5" fill="#4a6fa5">クランク（平板。根元はホーンに固定）</text>
<text x="806" y="428" font-size="11.5" fill="#2f9e8f">下腿（二股）</text>
<text x="712" y="398" font-size="11.5" fill="#333">段付ボルト φ4 / M3</text>
<line x1="686" y1="425" x2="650" y2="456" stroke="#c0392b" stroke-width="0.9"/>
<text x="606" y="460" font-size="11.5" fill="#c0392b">軸受</text>
<text x="560" y="508" font-size="11.5" fill="#5b6470">二股にするのは<tspan font-weight="600">下腿側</tspan>。クランクは根元で 10.6 N·m の曲げを受けるので</text>
<text x="560" y="525" font-size="11.5" fill="#5b6470">板厚 6 mm が要り、平板のまま作れる形にしておく（レーザー切断や meviy で作れる）。</text>
<text x="560" y="542" font-size="11.5" fill="#5b6470">足先 F は下腿 2 本とバネが集まるので、二股の「足先ブロック」を 1 部品作って</text>
<text x="560" y="559" font-size="11.5" fill="#5b6470">下腿 2 本のタングを挟む（各下腿は膝側フォーク・足先側タングの非対称になる）。</text>
<text x="560" y="576" font-size="11.5" fill="#5b6470">強度は φ3 でも十分（二面せん断 7.6 MPa、面圧 8.9 MPa）。決めるのは軸受の内径とガタ。</text>
<text x="560" y="593" font-size="11.5" fill="#5b6470">樹脂すべり軸受なら PV 0.07（許容 0.3〜1）で 1 個 0.15 g。ガタが出たら 684ZZ（1.5 g）に置換。</text>
<rect x="560" y="616" width="452" height="82" fill="#fdf6e8" stroke="#c98a12" stroke-width="1.2" rx="4"/>
<text x="572" y="637" font-size="11.5" font-weight="600" fill="#8a5d00">質量制約: 下腿＋足で 50 g（150 g で転倒）</text>
<text x="572" y="655" font-size="11.5" fill="#5b6470">実部品で積むと 64.5 g（§8）。重いのはばね 14.5 g（規格品 サミニ 11-1437）とシャンク 2 本 16.8 g。</text>
<text x="572" y="672" font-size="11.5" fill="#5b6470">削り代はシャンクの肉厚（PA-CF 1.0 → 0.8）と足先ブロックの肉抜き。ばねは動かせない。</text>
<text x="572" y="689" font-size="11" fill="#8a5d00">※ 50 g と 150 g の間は未検証。実質量が出たらシミュレーションで確認できる</text>
</svg>