<line x1="348" y1="489" x2="339" y2="498" stroke="#c8c8c8"/>
<line x1="362" y1="489" x2="354" y2="498" stroke="#c8c8c8"/>
<circle cx="275.0" cy="200.0" r="4.5" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="243" y="194" font-size="11.5" font-weight="600">P1</text>
<circle cx="325.0" cy="200.0" r="4.5" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="338" y="194" font-size="11.5" font-weight="600">P2</text>
<circle cx="184.5" cy="266.9" r="4.5" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="153" y="272" font-size="11.5" font-weight="600">K1</text>
<circle cx="415.5" cy="266.9" r="4.5" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="428" y="272" font-size="11.5" font-weight="600">K2</text>
<circle cx="300.0" cy="381.2" r="4.5" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="315" y="386" font-size="11.5" font-weight="600">F</text>
<line x1="275" y1="170" x2="325" y2="170" stroke="#5b6470" stroke-width="1" marker-start="url(#dim2)" marker-end="url(#dim)"/>
<text x="300" y="165" font-size="11" fill="#5b6470" text-anchor="middle">d0 = 40</text>
<line x1="263" y1="184" x2="173" y2="251" stroke="#5b6470" stroke-width="1" marker-start="url(#dim2)" marker-end="url(#dim)"/>
<text x="218" y="212" font-size="11" fill="#5b6470" text-anchor="middle">l1 = 90</text>
<line x1="166" y1="286" x2="281" y2="400" stroke="#5b6470" stroke-width="1" marker-start="url(#dim2)" marker-end="url(#dim)"/>
<text x="223" y="338" font-size="11" fill="#5b6470" text-anchor="middle">l2 = 130</text>
<line x1="452" y1="200" x2="452" y2="381" stroke="#5b6470" stroke-width="1" marker-start="url(#dim2)" marker-end="url(#dim)"/>
<text x="458" y="290" font-size="11" fill="#5b6470">先端長 145</text>
<line x1="452" y1="381" x2="452" y2="481" stroke="#5b6470" stroke-width="1" marker-start="url(#dim2)" marker-end="url(#dim)"/>
<text x="458" y="431" font-size="11" fill="#5b6470">バネ 80</text>
<line x1="135" y1="200" x2="135" y2="481" stroke="#5b6470" stroke-width="1" marker-start="url(#dim2)" marker-end="url(#dim)"/>
<text x="68" y="332" font-size="11" fill="#5b6470">L0 = 240</text>
<text x="60" y="350" font-size="11" fill="#5b6470">（股→接地）</text>
<text x="222" y="265" font-size="11" fill="#4a6fa5">θ1 = −143.5°</text>
<text x="320" y="265" font-size="11" fill="#4a6fa5">θ2 = −36.5°</text>
<text x="324" y="366" font-size="11" fill="#2f9e8f">内角 90.5°</text>
<text x="338" y="478" font-size="11" fill="#333">ゴムパッド φ50</text>
<text x="40" y="528" font-size="11.5" fill="#5b6470">①② XM540-W270（脚長、10.6 N·m / 30 rpm）　③ XH540-W150（ロール、7.1 N·m / 70 rpm）</text>
<text x="40" y="547" font-size="11.5" fill="#5b6470">P1 / P2: サーボ出力軸（駆動）　K1 / K2: 膝（受動）　F: 足先（下腿 2 本が合流 ＝ 閉ループ）</text>
<text x="40" y="566" font-size="11.5" fill="#5b6470">下腿は膝と足先の 2 点だけで支持される「二力部材」で、軸力しか掛からない</text>
<text x="40" y="585" font-size="11.5" fill="#5b6470">（曲げの設計が要らない）。膝は受動関節なので、脚にサーボが載らない。</text>
<text x="40" y="604" font-size="11.5" fill="#5b6470">2 個のサーボが荷重を分担し、脚長と前後の振りを同時に作る。</text>
<text x="560" y="80" font-size="14" font-weight="bold">B. Z 方向の層構成（脚長サーボの軸に沿った断面）</text>
<rect x="584" y="106" width="183" height="52" fill="#ffe9d2" stroke="#c9762b" stroke-width="1.6"/>
<line x1="675" y1="158" x2="675" y2="166" stroke="#aaa" stroke-width="0.8"/>
<rect x="767" y="106" width="11" height="52" fill="#f6d5b0" stroke="#c9762b" stroke-width="1.6"/>
<line x1="772" y1="158" x2="772" y2="181" stroke="#aaa" stroke-width="0.8"/>
<rect x="777" y="106" width="25" height="52" fill="#dbe6f3" stroke="#4a6fa5" stroke-width="1.6"/>
<line x1="790" y1="158" x2="790" y2="196" stroke="#aaa" stroke-width="0.8"/>
<rect x="802" y="106" width="17" height="52" fill="#e8e2f6" stroke="#8e5bd6" stroke-width="1.6"/>
<line x1="811" y1="158" x2="811" y2="211" stroke="#aaa" stroke-width="0.8"/>
<rect x="819" y="106" width="17" height="52" fill="#e3e7ec" stroke="#5b6470" stroke-width="1.6"/>
<line x1="827" y1="158" x2="827" y2="226" stroke="#aaa" stroke-width="0.8"/>
<text x="679" y="170" font-size="10.5" fill="#c9762b">サーボ本体 44</text>
<text x="776" y="185" font-size="10.5" fill="#c9762b">ホーン</text>
<text x="794" y="200" font-size="10.5" fill="#4a6fa5">クランク 6</text>
<text x="815" y="215" font-size="10.5" fill="#8e5bd6">軸受</text>
<text x="831" y="230" font-size="10.5" fill="#5b6470">外側板</text>
<line x1="567" y1="132" x2="854" y2="132" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="8 3 2 3"/>
<text x="859" y="136" font-size="11" fill="#c0392b">サーボ軸（Z）</text>
<text x="560" y="266" font-size="11.5" font-weight="600" fill="#c0392b">クランクを片持ちにしない</text>
<text x="560" y="286" font-size="11.5" fill="#5b6470">設計荷重ではクランク先端に 107 N。ホーン側だけで受けるとサーボ出力軸に</text>
<text x="560" y="303" font-size="11.5" fill="#5b6470">ラジアル荷重が集中する。外側にもう 1 枚板を置き、軸受で受けて両持ちにする</text>
<text x="560" y="320" font-size="11.5" fill="#5b6470">（コの字フレーム）。脚長サーボ 2 個は軸が平行なので外側板は共用できる。</text>
<text x="560" y="348" font-size="14" font-weight="bold">C. 膝 K・足先 F の関節（二面せん断 = クレビス）</text>
<rect x="630" y="382" width="150" height="16" fill="#dbe6f3" stroke="#4a6fa5" stroke-width="1.6"/>
<rect x="630" y="440" width="150" height="16" fill="#dbe6f3" stroke="#4a6fa5" stroke-width="1.6"/>
<rect x="630" y="382" width="26" height="74" fill="#dbe6f3" stroke="#4a6fa5" stroke-width="1.6"/>
<rect x="726" y="406" width="150" height="26" fill="#d6efe9" stroke="#2f9e8f" stroke-width="1.6"/>
<rect x="748" y="406" width="26" height="6" fill="#f3d9d9" stroke="#c0392b" stroke-width="1.2"/>
<rect x="748" y="426" width="26" height="6" fill="#f3d9d9" stroke="#c0392b" stroke-width="1.2"/>
<rect x="752" y="368" width="18" height="14" rx="2" fill="#9aa4b0" stroke="#444" stroke-width="1.4"/>
<rect x="754" y="382" width="14" height="74" fill="#b9c2cc" stroke="#444" stroke-width="1.4"/>
<rect x="756" y="456" width="10" height="13" fill="#7f8894" stroke="#444" stroke-width="1.2"/>
<text x="780" y="378" font-size="11.5" fill="#333">段付ボルト（φ4 軸 / M3 ねじ）</text>
<text x="780" y="474" font-size="11.5" fill="#333">ねじ部で締結</text>
<text x="568" y="396" font-size="11.5" fill="#4a6fa5">クランク</text>
<text x="568" y="412" font-size="11.5" fill="#4a6fa5">（二股）</text>
<text x="882" y="424" font-size="11.5" fill="#2f9e8f">下腿</text>
<text x="780" y="428" font-size="11.5" fill="#c0392b">軸受</text>
<text x="560" y="488" font-size="11.5" fill="#5b6470">強度は φ3 でも十分（二面せん断 7.6 MPa、面圧 8.9 MPa）。寸法を決めるのは</text>
<text x="560" y="505" font-size="11.5" fill="#5b6470">軸受の内径とガタ。樹脂すべり軸受なら PV 0.07（許容 0.3〜1）で余裕があり、</text>
<text x="560" y="522" font-size="11.5" fill="#5b6470">1 個 0.15 g と軽い。ガタが問題になったら 684ZZ（φ4×φ9×4、1.5 g）に置換。</text>
<text x="560" y="548" font-size="11.5" font-weight="600" fill="#c0392b">片持ちは不可</text>
<text x="648" y="548" font-size="11.5" fill="#5b6470">: 軸に曲げが入るうえ、リンク面が Z 方向にずれて</text>
<text x="560" y="565" font-size="11.5" fill="#5b6470">接地力の作用線が脚面から外れる（3D で転倒条件になった問題）。</text>
<rect x="560" y="586" width="452" height="82" fill="#fdf6e8" stroke="#c98a12" stroke-width="1.2" rx="4"/>
<text x="572" y="607" font-size="11.5" font-weight="600" fill="#8a5d00">質量制約: 下腿＋足で 50 g（150 g で転倒）</text>
<text x="572" y="625" font-size="11.5" fill="#5b6470">実部品で積むと 54 g。重いのはバネ 14 g と段付ボルト 3 本で 8.7 g。</text>
<text x="572" y="642" font-size="11.5" fill="#5b6470">バネを硬くする（k 900 → 2000）と 5.6 g に減り 48 g に収まる。</text>
<text x="572" y="659" font-size="11" fill="#8a5d00">※ 50 g と 150 g の間は未検証。実質量が出たらシミュレーションで確認できる</text>
</svg>