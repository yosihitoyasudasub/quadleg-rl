<text x="840.0" y="402.0" font-size="12.5" fill="#3f8f57" text-anchor="middle" font-weight="bold">シャンク ① ②（タング t4）</text>
<text x="840.0" y="419.0" font-size="11" fill="#3f8f57" text-anchor="middle" font-weight="normal">↑ 膝へ</text>
<text x="760.8" y="603.0" font-size="12.5" fill="#8e5bd6" text-anchor="end" font-weight="bold">足先ブロック（二股）</text>
<text x="840.0" y="738.0" font-size="11" fill="#8e5bd6" text-anchor="middle" font-weight="normal">↓ バネ・足パッドへ</text>
<line x1="819.8" y1="554.4" x2="793.8" y2="498.4" stroke="#c9762b" stroke-width="1.1"/>
<text x="789.8" y="496.4" font-size="11" fill="#c9762b" text-anchor="end" font-weight="normal">すべり軸受 φ4 / φ6</text>
<text x="789.8" y="510.4" font-size="11" fill="#c9762b" text-anchor="end" font-weight="normal">（シャンクの穴 φ6 H7 に圧入）</text>
<line x1="774.8" y1="774.0" x2="905.2" y2="774.0" stroke="#5b6470" stroke-width="1" marker-start="url(#d2)" marker-end="url(#d1)"/>
<text x="840.0" y="767.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">2.5 ＋ 4 ＋ 4 ＋ 2.5 ＋ ワッシャ = 14.5</text>
<text x="840.0" y="794.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">段付ボルト 軸 φ4 × 15 / ねじ M3</text>
<rect x="30.0" y="836.0" width="1080.0" height="118.0" fill="#f7f9fb" stroke="#c9d3de" stroke-width="1.2"/>
<text x="50.0" y="862.0" font-size="13" fill="#111" text-anchor="start" font-weight="bold">要点</text>
<text x="50.0" y="885.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">・ピンはどちらも同じ段付ボルト φ4（ねじ M3）。変わるのは軸長（膝 12 / 足先 15）と「どちらの部品に穴 φ6 を開けるか」だけ。</text>
<text x="50.0" y="905.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">・すべり軸受は必ず「回る側」に入れる。膝ではクランク、足先ではシャンク。ピンは固定側の爪に締め付けて、回らないようにする。</text>
<text x="50.0" y="925.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">・シャンクの穴は膝側 φ4 H7・足先側 φ6 H7 で径が違う。φ6 は幅 10 mm では縁の肉が足りないので、足先端だけ幅 15 mm のボスにする。</text>
<text x="50.0" y="945.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">・左右 2 本のシャンクは同一形状。足先では Z 方向に 4 mm ずれて並ぶ（2 本の脚面がもともと別の層にあるので矛盾しない）。</text>
</svg>