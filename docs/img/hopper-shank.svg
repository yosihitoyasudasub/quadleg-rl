<text x="183.0" y="228.0" font-size="12" fill="#3f8f57" text-anchor="middle" font-weight="bold">膝 K 側：二股（フォーク）</text>
<text x="183.0" y="244.0" font-size="11" fill="#3f8f57" text-anchor="middle" font-weight="normal">爪厚 3 × 2、スリット 6.0</text>
<text x="546.0" y="300.0" font-size="12" fill="#3f8f57" text-anchor="middle" font-weight="bold">足先 F 側：タング 厚さ 4</text>
<text x="267.0" y="285.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">主スパン 厚さ 2.5</text>
<text x="30.0" y="348.0" font-size="14.5" fill="#111" text-anchor="start" font-weight="bold">B. 膝 K の断面（ピン軸を含む断面。上がサーボ側、下が足先側）</text>
<text x="30.0" y="369.0" font-size="12" fill="#5b6470" text-anchor="start" font-weight="normal">シャンクの二股がクランクを挟む。回るのはクランク側 → ブッシュはクランクの穴に入る</text>
