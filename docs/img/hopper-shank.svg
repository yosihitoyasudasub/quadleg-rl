<text x="320.0" y="402.0" font-size="12.5" fill="#4a6fa5" text-anchor="middle" font-weight="bold">クランク（平板 t5）</text>
<text x="320.0" y="419.0" font-size="11" fill="#4a6fa5" text-anchor="middle" font-weight="normal">↑ サーボホーンへ</text>
<text x="388.0" y="666.0" font-size="12.5" fill="#3f8f57" text-anchor="start" font-weight="bold">シャンク（二股）</text>
<text x="388.0" y="683.0" font-size="11" fill="#3f8f57" text-anchor="start" font-weight="normal">↓ 足先へ</text>
<line x1="320.0" y1="554.4" x2="380.0" y2="504.4" stroke="#c9762b" stroke-width="1.1"/>
<text x="384.0" y="502.4" font-size="11" fill="#c9762b" text-anchor="start" font-weight="normal">すべり軸受 φ4 / φ6 フランジ付</text>
<text x="384.0" y="516.4" font-size="11" fill="#c9762b" text-anchor="start" font-weight="normal">（クランクの穴 φ6 H7 に圧入）</text>
<line x1="257.0" y1="585.0" x2="219.0" y2="529.0" stroke="#5b6470" stroke-width="1.1"/>
<text x="215.0" y="527.0" font-size="11.5" fill="#5b6470" text-anchor="end" font-weight="normal">段付ボルト</text>
<text x="215.0" y="541.0" font-size="11" fill="#5b6470" text-anchor="end" font-weight="normal">軸 φ4 × 12 / ねじ M3</text>
<line x1="266.0" y1="774.0" x2="374.0" y2="774.0" stroke="#5b6470" stroke-width="1" marker-start="url(#d2)" marker-end="url(#d1)"/>
<text x="320.0" y="767.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">3 ＋ 6.0 ＋ 3 = 12</text>
<text x="620.0" y="348.0" font-size="14.5" fill="#111" text-anchor="start" font-weight="bold">C. 足先 F の断面（同じ向き。上が膝側、下が接地側）</text>
<text x="620.0" y="369.0" font-size="12" fill="#5b6470" text-anchor="start" font-weight="normal">足先ブロックが二股。シャンク 2 本は挟まれる側 → ブッシュはシャンクの穴に入る</text>
