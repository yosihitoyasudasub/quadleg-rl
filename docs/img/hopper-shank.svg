<rect x="0.0" y="0.0" width="1140.0" height="1000.0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="22.0" y="34.0" font-size="19" fill="#111" text-anchor="start" font-weight="bold">シャンク（下腿 l2 = 130 mm）の両端の関節構造</text>
<text x="22.0" y="56.0" font-size="12.5" fill="#5b6470" text-anchor="start" font-weight="normal">膝 K ではシャンクが「挟む側（二股）」、足先 F では「挟まれる側（タング）」。1 本の中で役割が入れ替わる</text>
<text x="30.0" y="96.0" font-size="14.5" fill="#111" text-anchor="start" font-weight="bold">A. シャンク単体（2 面図）— 左端が膝 K、右端が足先 F</text>
