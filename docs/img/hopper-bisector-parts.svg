<rect x="30.0" y="838.0" width="1220.0" height="156.0" rx="0.0" fill="#f7f9fb" stroke="#c9d3de" stroke-width="1.2"/>
<text x="50.0" y="864.0" font-size="13.5" fill="#111" text-anchor="start" font-weight="bold">組む順番と確認</text>
<text x="50.0" y="888.0" font-size="11.5" fill="#333" text-anchor="start" font-weight="normal">1. シャンク①② に φ3 の穴（F から 30）を開ける。2. 小リンクを 2 枚作る（穴間 30）。3. 足先ブロックに腕とスロットを付ける。4. ジョイントを組む。</text>
<text x="50.0" y="910.0" font-size="11.5" fill="#333" text-anchor="start" font-weight="normal">   ジョイント: A1・A2・C は回転、腕と C は「ピン-スロット」（スライダにすると拘束が 1 つ多く、過拘束になる）。F は既存の回転に足先ブロックを足す。</text>
<text x="50.0" y="932.0" font-size="11.5" fill="#333" text-anchor="start" font-weight="normal">   検算: 菱形は対辺が平行なので、リンク①（A1→C）は常にシャンク②（F→K2）と平行。全姿勢で差 0.000°。Fusion の計測で確かめられる。</text>
<text x="50.0" y="954.0" font-size="11.5" fill="#333" text-anchor="start" font-weight="normal">   質量: 小リンク 1.54 g × 2 ＋ ピン 3 本 2.74 g ＋ スペーサ 0.18 g ＋ E リング 0.1 g ＝ 6.1 g、腕 1.3 g。合計 7.4 g が足の質量に加わる。</text>
<text x="50.0" y="982.0" font-size="11.5" fill="#c1121f" text-anchor="start" font-weight="bold">※ 精度が効くのは「4 辺が等しいこと」だけ。穴間 30 mm を左右 4 箇所で揃える。絶対位置の精度は要らない。</text>
